<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchool Chat</title>
  <style>
    :root {
      /* Soft, eye-friendly chat background */
      --bg-chat: hsl(222, 30%, 96%);
      --bg-primary: hsl(222, 30%, 96%);
      --bg-secondary: hsl(220, 25%, 94%);
      --bg-input: hsl(220, 30%, 98%);
      --surface: hsl(0, 0%, 100%);
      
      /* Modern indigo-violet gradient palette */
      --primary: hsl(239, 84%, 67%);
      --primary-light: hsl(243, 75%, 59%);
      --primary-dark: hsl(239, 84%, 57%);
      --accent: hsl(271, 81%, 56%);
      --accent-light: hsl(271, 81%, 66%);
      
      /* Header gradient colors */
      --header-gradient-start: hsl(239, 84%, 67%);
      --header-gradient-mid: hsl(243, 75%, 59%);
      --header-gradient-end: hsl(271, 91%, 65%);
      
      --text-primary: hsl(222, 30%, 15%);
      --text-secondary: hsl(220, 15%, 45%);
      --text-muted: hsl(220, 10%, 60%);
      --border: hsl(220, 20%, 88%);
      --border-light: hsl(220, 20%, 92%);
      --shadow-sm: 0 1px 3px hsla(222, 30%, 20%, 0.06);
      --shadow-md: 0 4px 12px hsla(222, 30%, 20%, 0.1);
      --shadow-lg: 0 8px 30px hsla(222, 30%, 20%, 0.12);
      --shadow-glow: 0 4px 20px hsla(239, 84%, 67%, 0.25);
      --radius: 12px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }


    .chat-container {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border-radius: 0;
        border: none;
        display: flex;
        flex-direction: column;
    }


    .chat-header {
      padding: 24px 28px;
      background: linear-gradient(135deg, var(--header-gradient-start) 0%, var(--header-gradient-mid) 50%, var(--header-gradient-end) 100%);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .chat-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, hsla(271, 81%, 70%, 0.35) 0%, transparent 70%);
      pointer-events: none;
    }

    .chat-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: 10%;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, hsla(239, 84%, 75%, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .chat-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-title-icon {
      width: 32px;
      height: 32px;
      background: hsla(0, 0%, 100%, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .chat-subtitle {
      margin-top: 6px;
      font-size: 0.875rem;
      opacity: 0.85;
      font-weight: 400;
    }

    .online-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: hsl(145, 65%, 50%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      padding-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: #b7d7e4ff;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: messageSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 0.938rem;
      position: relative;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message.bot .message-bubble {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 0 4px;
    }

    .message.user .message-time {
      text-align: right;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
      box-shadow: var(--shadow-sm);
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-area {
      padding: 28px 24px 32px 24px;
      margin-top: 0;
      background: var(--surface);
      border-top: 1px solid #e5e7eb;
      box-shadow: 0 -4px 16px hsla(220, 20%, 20%, 0.05);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 15px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      font-size: 0.938rem;
      font-family: inherit;
      background: hsl(220, 25%, 98%);
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .chat-input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 4px hsla(239, 84%, 67%, 0.12);
    }

    .send-button {
      width: 48px;
      height: 48px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .send-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
      filter: brightness(1.08);
    }

    .send-button:active {
      transform: translateY(0);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .send-button svg {
      width: 20px;
      height: 20px;
    }

    .powered-by {
      text-align: center;
      padding: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface);
      letter-spacing: 0.03em;
    }

    .powered-by span {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }
      
      .chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
        border: none;
      }

      .message {
        max-width: 88%;
      }

      .chat-header {
        padding: 20px;
      }

      .chat-messages {
        padding: 16px;
        padding-bottom: 48px; 
      }

      .chat-input-area {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-content">
        <h1 class="chat-title">
          <span class="chat-title-icon">🎓</span>
          SmartSchool Chat
        </h1>
        <p class="chat-subtitle">Logged in as {{USER_ID}}</p>
        <div class="online-indicator">
          <span class="online-dot"></span>
          AI Assistant Online
        </div>
      </div>
    </header>

    <div class="chat-messages" id="chatMessages">
      <!-- Messages will be inserted here -->
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <input 
          type="text" 
          class="chat-input" 
          id="chatInput" 
          placeholder="Nhập tin nhắn của bạn..." 
          autocomplete="off"
        />
        <button class="send-button" id="sendButton" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <div class="powered-by">
      Powered by <span>SmartSchool AI</span> • Canvas LMS Integration
    </div>
  </div>

  <script>
    (function() {
      const chatMessages = document.getElementById('chatMessages');
      const chatInput = document.getElementById('chatInput');
      const sendButton = document.getElementById('sendButton');
      const userId = '{{USER_ID}}';

      function formatTime() {
        const now = new Date();
        return now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      }

      function createMessageElement(content, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        
        messageDiv.innerHTML = `
          <div class="message-bubble">${escapeHtml(content)}</div>
          <span class="message-time">${formatTime()}</span>
        `;
        
        return messageDiv;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function addMessage(content, isUser) {
        const messageEl = createMessageElement(content, isUser);
        chatMessages.appendChild(messageEl);
        scrollToBottom();
      }

      function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
          <div class="typing-indicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        `;
        chatMessages.appendChild(typingDiv);
        scrollToBottom();
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) {
          indicator.remove();
        }
      }

      function scrollToBottom() {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      }
      const CHAT_CONTEXT = {
        student_id: "{{USER_ID}}",
        course_id: "{{COURSE_ID}}"
      };
      async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        chatInput.value = '';
        sendButton.disabled = true;

        addMessage(message, true);
        showTypingIndicator();

        try {
          const response = await fetch('/lti/chat/message', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: message,
              student_id: CHAT_CONTEXT.student_id,
              course_id: "course_4",
            })
          });
          removeTypingIndicator();
          if (response.ok) {
            const data = await response.json();
            addMessage(data.answer || 'Xin lỗi, mình không có câu trả lời cho câu hỏi của bạn.');
          } else {
            addMessage('Xin lỗi, đã có lỗi xảy ra. Vui lòng thử lại.', false);
          }
        } catch (error) {
          removeTypingIndicator();
          addMessage('Không thể kết nối đến máy chủ. Vui lòng kiểm tra kết nối mạng.', false);
        }

        sendButton.disabled = false;
        chatInput.focus();
      }

      sendButton.addEventListener('click', sendMessage);

      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Initial greeting on page load
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          addMessage(`👋 Xin chào ${userId}, mình là SmartSchool Chat. Mình có thể giúp gì cho bạn hôm nay?`, false);
        }, 500);
      });

      chatInput.focus();
    })();
  </script>
</body>
</html>
